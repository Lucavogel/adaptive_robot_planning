<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 40px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .panel { fill: #f8fbff; stroke-width: 2.8; }
      .inner { fill: #ffffff; stroke-width: 2; }
      .blue { stroke: #0b5cad; }
      .purple { stroke: #6d3fa0; }
      .orange { stroke: #f97316; }
      .green { stroke: #0f8a5f; }
      .teal { stroke: #0f7c85; }
      .muted { stroke: #64748b; }
      .txt-blue { fill: #0b5cad; }
      .txt-purple { fill: #5b2d91; }
      .txt-orange { fill: #ea580c; }
      .txt-green { fill: #08734f; }
      .txt-teal { fill: #0f6f78; }
      .heading { font: 800 21px Arial, sans-serif; letter-spacing: 0; }
      .sub { font: 500 15px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .body { font: 500 15px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .small { font: 500 13px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .mono { font: 700 13px "Courier New", monospace; fill: #0f4f68; letter-spacing: 0; }
      .num { fill: #ffffff; stroke-width: 2.5; }
      .num-text { font: 800 20px Arial, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #111827; stroke-width: 3.4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #111827; stroke-width: 3.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #0b5cad; stroke-width: 2; stroke-dasharray: 8 6; }
      .metric-line { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="950"/>
  <text class="title" x="900" y="58" text-anchor="middle">StretchBot Adaptive Interaction Pipeline</text>

  <!-- 1 Perception -->
  <g transform="translate(35,120)">
    <rect class="panel blue" x="0" y="0" width="255" height="520" rx="14"/>
    <circle cx="22" cy="-8" r="20" fill="#0b5cad"/>
    <text class="num-text" x="22" y="0" text-anchor="middle">1</text>
    <text class="heading txt-blue" x="128" y="52" text-anchor="middle">PERCEPTION</text>
    <text class="heading txt-blue" x="128" y="76" text-anchor="middle">MODULES</text>
    <rect class="inner blue" x="18" y="118" width="219" height="77" rx="8"/>
    <text class="label" x="112" y="148" text-anchor="middle">STT</text>
    <text class="body" x="112" y="172" text-anchor="middle">Speech-to-text</text>
    <rect class="inner blue" x="18" y="215" width="219" height="77" rx="8"/>
    <text class="label" x="112" y="245" text-anchor="middle">EMOTION</text>
    <text class="body" x="112" y="269" text-anchor="middle">Affective cues</text>
    <rect class="inner blue" x="18" y="312" width="219" height="77" rx="8"/>
    <text class="label" x="112" y="342" text-anchor="middle">OBJECT DETECTION</text>
    <text class="body" x="112" y="366" text-anchor="middle">Detected objects</text>
    <rect class="inner blue" x="18" y="409" width="219" height="86" rx="8"/>
    <text class="label" x="112" y="438" text-anchor="middle">POSE MONITORING</text>
    <text class="body" x="112" y="462" text-anchor="middle">Exercise status</text>
  </g>

  <!-- 2 Context -->
  <g transform="translate(340,120)">
    <rect class="panel purple" x="0" y="0" width="255" height="520" rx="14"/>
    <circle cx="22" cy="-8" r="20" fill="#6d3fa0"/>
    <text class="num-text" x="22" y="0" text-anchor="middle">2</text>
    <text class="heading txt-purple" x="128" y="52" text-anchor="middle">CONTEXT PACKAGE</text>
    <text class="heading txt-purple" x="128" y="76" text-anchor="middle">(USER CONTEXT)</text>
    <circle cx="128" cy="175" r="55" fill="#f3efff" stroke="#6d3fa0" stroke-width="3"/>
    <circle cx="128" cy="156" r="18" fill="#6d3fa0"/>
    <path d="M85 218 C96 185 160 185 171 218 Z" fill="#6d3fa0"/>
    <line x1="84" y1="135" x2="52" y2="105" stroke="#6d3fa0" stroke-width="3"/>
    <line x1="172" y1="135" x2="204" y2="105" stroke="#6d3fa0" stroke-width="3"/>
    <rect x="39" y="94" width="25" height="34" fill="#ffffff" stroke="#6d3fa0" stroke-width="3"/>
    <rect x="192" y="94" width="25" height="34" fill="#ffffff" stroke="#6d3fa0" stroke-width="3"/>
    <circle cx="52" cy="300" r="7" fill="#6d3fa0"/>
    <text class="body" x="76" y="306">User utterance</text>
    <circle cx="52" cy="336" r="7" fill="#6d3fa0"/>
    <text class="body" x="76" y="342">Detected objects</text>
    <circle cx="52" cy="372" r="7" fill="#6d3fa0"/>
    <text class="body" x="76" y="378">Exercise status</text>
    <circle cx="52" cy="408" r="7" fill="#6d3fa0"/>
    <text class="body" x="76" y="414">Affective state</text>
    <circle cx="52" cy="444" r="7" fill="#6d3fa0"/>
    <text class="body" x="76" y="450">Interaction history</text>
  </g>

  <!-- 3 KG -->
  <g transform="translate(645,120)">
    <rect class="panel orange" x="0" y="0" width="255" height="520" rx="14" fill="#fffbf3"/>
    <circle cx="22" cy="-8" r="20" fill="#f97316"/>
    <text class="num-text" x="22" y="0" text-anchor="middle">3</text>
    <text class="heading txt-orange" x="128" y="52" text-anchor="middle">KNOWLEDGE GRAPH</text>
    <text class="heading txt-orange" x="128" y="76" text-anchor="middle">RETRIEVAL</text>
    <line x1="128" y1="152" x2="92" y2="184" stroke="#f97316" stroke-width="4"/>
    <line x1="128" y1="152" x2="165" y2="184" stroke="#f97316" stroke-width="4"/>
    <line x1="128" y1="152" x2="128" y2="115" stroke="#f97316" stroke-width="4"/>
    <line x1="92" y1="184" x2="75" y2="216" stroke="#f97316" stroke-width="4"/>
    <line x1="165" y1="184" x2="198" y2="213" stroke="#f97316" stroke-width="4"/>
    <circle cx="128" cy="152" r="13" fill="#f97316"/>
    <circle cx="128" cy="115" r="9" fill="#f97316"/>
    <circle cx="92" cy="184" r="9" fill="#f97316"/>
    <circle cx="165" cy="184" r="9" fill="#f97316"/>
    <circle cx="75" cy="216" r="9" fill="#f97316"/>
    <circle cx="198" cy="213" r="9" fill="#f97316"/>
    <rect class="inner orange" x="20" y="265" width="215" height="80" rx="8"/>
    <text class="label" x="128" y="298" text-anchor="middle">INTERNAL KG</text>
    <text class="body" x="128" y="322" text-anchor="middle">domain knowledge</text>
    <path class="arrow" d="M128 352 L128 392"/>
    <rect class="inner orange" x="20" y="397" width="215" height="72" rx="8"/>
    <text class="label" x="128" y="426" text-anchor="middle">CONCEPTNET</text>
    <text class="body" x="128" y="450" text-anchor="middle">fallback</text>
    <text class="sub txt-orange" x="128" y="500" text-anchor="middle">relevant relations</text>
  </g>

  <!-- 4 Primary LLM -->
  <g transform="translate(950,120)">
    <rect class="panel green" x="0" y="0" width="255" height="520" rx="14" fill="#f4fff8"/>
    <circle cx="22" cy="-8" r="20" fill="#0f8a5f"/>
    <text class="num-text" x="22" y="0" text-anchor="middle">4</text>
    <text class="heading txt-green" x="128" y="52" text-anchor="middle">PRIMARY LLM</text>
    <text class="sub" x="128" y="78" text-anchor="middle">grounded reasoning</text>
    <path d="M108 132 C88 132 82 151 90 165 C73 172 76 204 100 204 C105 225 135 225 142 207 C163 207 170 181 154 168 C162 145 141 126 124 138 C121 134 116 132 108 132 Z"
          fill="#ffffff" stroke="#0f8a5f" stroke-width="4"/>
    <path d="M136 147 L180 147 M136 170 L188 170 M136 193 L180 193" stroke="#0f8a5f" stroke-width="4"/>
    <circle cx="190" cy="147" r="5" fill="#0f8a5f"/>
    <circle cx="198" cy="170" r="5" fill="#0f8a5f"/>
    <circle cx="190" cy="193" r="5" fill="#0f8a5f"/>
    <rect class="inner green" x="25" y="267" width="205" height="82" rx="8"/>
    <text class="body" x="128" y="302" text-anchor="middle">Adaptive decision</text>
    <text class="small" x="128" y="326" text-anchor="middle">(action prefix)</text>
    <rect class="inner green" x="25" y="382" width="205" height="82" rx="8"/>
    <text class="body" x="128" y="414" text-anchor="middle">Natural-language</text>
    <text class="body" x="128" y="438" text-anchor="middle">response</text>
  </g>

  <!-- 5 Verifier -->
  <g transform="translate(1255,120)">
    <rect class="panel blue" x="0" y="0" width="255" height="520" rx="14"/>
    <circle cx="22" cy="-8" r="20" fill="#0b5cad"/>
    <text class="num-text" x="22" y="0" text-anchor="middle">5</text>
    <text class="heading txt-blue" x="128" y="52" text-anchor="middle">VERIFIER LLM</text>
    <text class="sub" x="128" y="78" text-anchor="middle">optional safeguard</text>
    <path d="M128 117 C152 133 173 131 190 123 C187 190 162 225 128 242 C94 225 69 190 66 123 C83 131 104 133 128 117 Z"
          fill="#ffffff" stroke="#0b5cad" stroke-width="5"/>
    <path d="M101 176 L122 197 L158 154" fill="none" stroke="#0b5cad" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="inner blue" x="25" y="275" width="205" height="58" rx="8"/>
    <text class="body" x="128" y="309" text-anchor="middle">Format check</text>
    <rect class="inner blue" x="25" y="355" width="205" height="58" rx="8"/>
    <text class="body" x="128" y="389" text-anchor="middle">Tone check</text>
    <rect class="inner blue" x="25" y="435" width="205" height="58" rx="8"/>
    <text class="body" x="128" y="462" text-anchor="middle">Safety / coherence</text>
    <text class="body" x="128" y="482" text-anchor="middle">check</text>
  </g>

  <!-- 6 Execution -->
  <g transform="translate(1540,120)">
    <rect class="panel teal" x="0" y="0" width="225" height="520" rx="14" fill="#f4fdff"/>
    <circle cx="22" cy="-8" r="20" fill="#0f7c85"/>
    <text class="num-text" x="22" y="0" text-anchor="middle">6</text>
    <text class="heading txt-teal" x="112.5" y="44" text-anchor="middle">COMMAND</text>
    <text class="heading txt-teal" x="112.5" y="68" text-anchor="middle">PARSER &amp; EXECUTION</text>
    <rect class="inner teal" x="18" y="105" width="189" height="165" rx="8"/>
    <text class="label txt-teal" x="112.5" y="139" text-anchor="middle">COMMAND PARSER</text>
    <text class="mono" x="43" y="178">NEXT_EXERCISE</text>
    <text class="mono" x="43" y="207">POINT_&lt;OBJECT&gt;</text>
    <text class="mono" x="43" y="236">STOP_ROUTINE</text>
    <rect class="inner teal" x="18" y="290" width="189" height="205" rx="8"/>
    <text class="label txt-teal" x="112.5" y="324" text-anchor="middle">EXECUTION LAYER</text>
    <text class="body" x="112.5" y="365" text-anchor="middle">TTS output</text>
    <text class="body" x="112.5" y="406" text-anchor="middle">Robot pointing</text>
    <text class="body" x="112.5" y="447" text-anchor="middle">Routine control</text>
    <text class="small" x="112.5" y="470" text-anchor="middle">(update state)</text>
  </g>

  <!-- Main arrows -->
  <path class="arrow" d="M294 380 L331 380"/>
  <path class="arrow" d="M599 380 L636 380"/>
  <path class="arrow" d="M904 380 L941 380"/>
  <path class="arrow" d="M1209 380 L1246 380"/>
  <path class="arrow" d="M1514 380 L1531 380"/>

  <!-- Logging and feedback -->
  <g transform="translate(565,690)">
    <rect x="0" y="0" width="760" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <circle cx="22" cy="0" r="19" fill="#555"/>
    <text class="num-text" x="22" y="7" text-anchor="middle">7</text>
    <text class="heading" x="380" y="34" text-anchor="middle">LOGGING / FEEDBACK / METRICS</text>
    <text class="body" x="88" y="78" text-anchor="middle">Response</text>
    <text class="body" x="88" y="98" text-anchor="middle">latency</text>
    <line class="metric-line" x1="155" y1="55" x2="155" y2="98"/>
    <text class="body" x="235" y="78" text-anchor="middle">Verifier</text>
    <text class="body" x="235" y="98" text-anchor="middle">edits</text>
    <line class="metric-line" x1="305" y1="55" x2="305" y2="98"/>
    <text class="body" x="382" y="78" text-anchor="middle">Selected</text>
    <text class="body" x="382" y="98" text-anchor="middle">action</text>
    <line class="metric-line" x1="455" y1="55" x2="455" y2="98"/>
    <text class="body" x="535" y="78" text-anchor="middle">Exercise</text>
    <text class="body" x="535" y="98" text-anchor="middle">success</text>
    <line class="metric-line" x1="610" y1="55" x2="610" y2="98"/>
    <text class="body" x="685" y="78" text-anchor="middle">User</text>
    <text class="body" x="685" y="98" text-anchor="middle">feedback</text>
  </g>

  <path class="loop" d="M1652 645 L1652 760 L1330 760"/>
  <path class="loop" d="M565 760 L465 760 L465 650"/>

  <!-- Flow footer -->
  <g transform="translate(280,865)">
    <rect class="dash" x="0" y="0" width="1240" height="54" rx="8" fill="#ffffff"/>
    <text class="heading txt-blue" x="74" y="35" text-anchor="middle">FLOW:</text>
    <text class="body" x="660" y="35" text-anchor="middle">
      Perception -> Context -> Knowledge -> Reasoning -> Verification -> Command -> Execution -> Feedback loop
    </text>
  </g>
</svg>
